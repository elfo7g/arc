<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
  :root {
    --night: #0b0e17;
    --night-soft: #121628;
    --gold: rgba(228, 209, 175, 1);
    --gold-66: rgba(228, 209, 175, 0.66);
    --gold-30: rgba(228, 209, 175, 0.3);
    --gold-12: rgba(228, 209, 175, 0.12);
    --ink: rgba(255, 254, 244, 0.92);
    --ink-soft: rgba(255, 254, 244, 0.64);
    --ink-faint: rgba(255, 254, 244, 0.4);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    background: var(--night);
    color: var(--ink);
    font-family: "Hiragino Mincho ProN", "Yu Mincho", Georgia, "Times New Roman", serif;
    line-height: 1.9;
    -webkit-font-smoothing: antialiased;
  }
  .wrap { max-width: 720px; margin: 0 auto; padding: 0 24px; }

  /* header */
  header {
    position: sticky; top: 0; z-index: 10;
    background: rgba(11, 14, 23, 0.85);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--gold-12);
  }
  .nav { display: flex; align-items: center; justify-content: space-between; padding: 16px 24px; max-width: 960px; margin: 0 auto; }
  .brand { font-size: 20px; letter-spacing: 0.35em; color: var(--gold-66); }
  .lang { display: flex; gap: 4px; }
  .lang button {
    background: none; border: 1px solid transparent; border-radius: 8px;
    color: var(--ink-faint); font-size: 12px; padding: 4px 8px; cursor: pointer;
    font-family: inherit; letter-spacing: 0.08em;
  }
  .lang button:hover { color: var(--ink-soft); }
  .lang button.active { color: var(--gold-66); border-color: var(--gold-30); }

  /* hero */
  .hero { padding: 110px 0 90px; text-align: center; position: relative; overflow: hidden; }
  .hero h1 {
    font-size: clamp(28px, 5.5vw, 44px);
    font-weight: 500; letter-spacing: 0.06em; line-height: 1.7;
  }
  .hero p.lead { margin-top: 28px; color: var(--ink-soft); font-size: clamp(15px, 2.5vw, 17px); }
  .stars { position: absolute; inset: 0; pointer-events: none; }
  .stars span {
    position: absolute; width: 2px; height: 2px; border-radius: 50%;
    background: var(--gold-66); opacity: 0.5;
    animation: twinkle 4s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100% { opacity: 0.15; } 50% { opacity: 0.6; } }

  .cta {
    display: inline-block; margin-top: 44px;
    border: 1px solid var(--gold-30); border-radius: 999px;
    color: var(--gold); text-decoration: none;
    padding: 14px 40px; font-size: 15px; letter-spacing: 0.12em;
    transition: background 0.3s, border-color 0.3s;
  }
  .cta:hover { background: var(--gold-12); border-color: var(--gold-66); }

  /* sections */
  section { padding: 72px 0; border-top: 1px solid var(--gold-12); }
  h2 {
    font-size: clamp(20px, 3.5vw, 26px); font-weight: 500;
    letter-spacing: 0.1em; margin-bottom: 40px; text-align: center;
    color: var(--gold-66);
  }
  .refusals { list-style: none; display: grid; gap: 20px; }
  .refusals li {
    border: 1px solid var(--gold-12); border-radius: 16px; padding: 24px 28px;
    background: var(--night-soft);
  }
  .refusals li strong { display: block; color: var(--gold-66); font-weight: 500; letter-spacing: 0.06em; margin-bottom: 6px; }
  .refusals li span { color: var(--ink-soft); font-size: 14.5px; }

  .steps { display: grid; gap: 32px; counter-reset: step; }
  .step { display: flex; gap: 20px; align-items: baseline; }
  .step .num {
    flex: none; width: 40px; height: 40px; border-radius: 50%;
    border: 1px solid var(--gold-30); color: var(--gold-66);
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .step h3 { font-weight: 500; letter-spacing: 0.06em; font-size: 17px; }
  .step p { color: var(--ink-soft); font-size: 14.5px; margin-top: 4px; }

  .trust { color: var(--ink-soft); font-size: 15px; text-align: center; }
  .trust p + p { margin-top: 18px; }
  .trust .badges { margin-top: 32px; display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; }
  .trust .badges span {
    border: 1px solid var(--gold-12); border-radius: 999px;
    padding: 6px 16px; font-size: 12.5px; letter-spacing: 0.08em; color: var(--ink-faint);

  footer { border-top: 1px solid var(--gold-12); padding: 40px 24px; text-align: center; color: var(--ink-faint); font-size: 12.5px; letter-spacing: 0.08em; }

function setLang(lang) {
  const dict = I18N[lang];
  if (!dict) return;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el => {
    const key = el.getAttribute("data-i18n");
    if (!(key in dict)) return;
    if (key === "hero_title") {
      el.innerHTML = "";
      dict[key].split("\n").forEach((line, i) => {
        if (i > 0) el.appendChild(document.createElement("br"));
        el.appendChild(document.createTextNode(line));
      });
    } else {
      el.textContent = dict[key];
    }
  });
  document.querySelectorAll(".lang button").forEach(b => {
    b.classList.toggle("active", b.dataset.lang === lang);
  });
  try { localStorage.setItem("arc-lp-lang", lang); } catch (e) {}
}

document.querySelectorAll(".lang button").forEach(b => {
  b.addEventListener("click", () => setLang(b.dataset.lang));
});
